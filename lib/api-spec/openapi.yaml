openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: listings
    description: Property listings
  - name: blog
    description: Blog posts
  - name: agents
    description: Real estate agents
  - name: inquiries
    description: Contact and property inquiries
  - name: services
    description: Agency services
  - name: storage
    description: Object storage upload and serving
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /listings:
    get:
      operationId: getListings
      tags: [listings]
      summary: List all properties
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [sale, rent]
        - name: featured
          in: query
          schema:
            type: boolean
        - name: location
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Array of listings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Listing"

  /listings/{id}:
    get:
      operationId: getListingById
      tags: [listings]
      summary: Get a single property listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A single listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /blog:
    get:
      operationId: getBlogPosts
      tags: [blog]
      summary: List all blog posts
      parameters:
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Array of blog posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlogPost"

  /blog/{id}:
    get:
      operationId: getBlogPostById
      tags: [blog]
      summary: Get a single blog post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A single blog post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPost"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /agents:
    get:
      operationId: getAgents
      tags: [agents]
      summary: List all agents
      responses:
        "200":
          description: Array of agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"

  /services:
    get:
      operationId: getServices
      tags: [services]
      summary: List all services
      responses:
        "200":
          description: Array of services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"

  /storage/uploads/request-url:
    post:
      tags: [storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /inquiries:
    post:
      operationId: submitInquiry
      tags: [inquiries]
      summary: Submit a contact or property inquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InquiryInput"
      responses:
        "201":
          description: Inquiry saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inquiry"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    Listing:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        title:
          type: string
        type:
          type: string
          enum: [sale, rent]
        price:
          type: string
        priceUnit:
          type: string
        location:
          type: string
        neighborhood:
          type: string
        bedrooms:
          type: number
        bathrooms:
          type: number
        sizeSqm:
          type: number
        description:
          type: string
        images:
          type: array
          items:
            type: string
        status:
          type: string
        featured:
          type: boolean
        dateAdded:
          type: string
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - slug
        - title
        - type
        - price
        - priceUnit
        - location
        - neighborhood
        - bedrooms
        - bathrooms
        - sizeSqm
        - description
        - images
        - status
        - featured
        - dateAdded

    BlogPost:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        title:
          type: string
        excerpt:
          type: string
        content:
          type: string
        author:
          type: string
        date:
          type: string
        category:
          type: string
        image:
          type: string
        publishedAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - slug
        - title
        - excerpt
        - content
        - author
        - date
        - category
        - image
        - publishedAt

    Agent:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
        phone:
          type: string
        email:
          type: string
        bio:
          type: string
        image:
          type: string
      required: [id, name, role, phone, email, bio, image]

    InquiryInput:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        message:
          type: string
        listingId:
          type: string
          nullable: true
      required: [name, email, message]

    Inquiry:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        message:
          type: string
        listingId:
          type: string
          nullable: true
        createdAt:
          type: string
      required: [id, name, email, message, createdAt]

    Service:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        image:
          type: string
        order:
          type: number
      required: [id, title, description, image, order]

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
        size:
          type: number
        contentType:
          type: string

    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
        objectPath:
          type: string
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'
